kind = "web"
previewPath = "/"
title = "Currículo por Vaga com IA"
version = "1.0.0"
id = "artifacts/curriculo-ia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22143

[services.development]
run = "pnpm --filter @workspace/curriculo-ia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/curriculo-ia", "run", "build" ]
publicDir = "artifacts/curriculo-ia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22143"
BASE_PATH = "/"
